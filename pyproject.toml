[project]
name = "regionate"
dynamic = ["version"]
authors = [
    {name="Henri F. Drake", email="hfdrake@uci.edu"},
]
description = "A package for creating xgcm-grid consistent regional masks and boundaries"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyproj",
    "geopandas",
    "shapely",
    # Needs the bipolar north-fold boundary from hdrake/xgcm@tripolar-north-fold
    # (xgcm#711) for single-tile tripolar-fold masks/boundaries (see notebook 3);
    # that branch also contains the face_connections halo-padding fix (xgcm#712)
    # required for correct multi-tile (lat-lon-cap / cap) padding. Until these are
    # released to PyPI, CI installs xgcm from that ref (see .github/workflows/ci.yml);
    # the floor stays at the satisfiable 0.9.0.
    "xgcm >= 0.9.0",
    "regionmask",
    "contourpy",
    # Requires the topology-driven sectionate API (face_connections- and
    # fold-aware neighbour finding, plus the 'left'/rotated-seam corner-neighbour
    # correction) from MOM6-community/sectionate#47. Until that is released to
    # PyPI, CI installs sectionate from the PR ref (see .github/workflows/ci.yml).
    # That branch self-reports version 0.3.3, so the floor stays at 0.3.3.
    "sectionate >= 0.3.3",
]

[project.urls]
"Homepage" = "https://github.com/hdrake/regionate"
"Bugs/Issues/Features" = "https://github.com/hdrake/regionate/issues"
"Sibling package" = "https://github.com/MOM6-community/sectionate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "regionate/version.py"

[tool.hatch.build]
exclude = ["examples/**", "data/**"]
