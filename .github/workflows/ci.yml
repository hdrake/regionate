name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.7.0
        with:
          access_token: ${{ github.token }}
      - name: Checkout source
        uses: actions/checkout@v2

      - name: Conda setup
        uses: conda-incubator/setup-miniconda@v2
        with:
          channels: conda-forge
          mamba-version: '*'
          python-version: ${{ matrix.python-version }}
          activate-environment: test_env_regionate
          auto-activate-base: false

      - name: Set up conda environment
        run: |
          mamba env update -f ci/environment.yml
          # TODO: drop these explicit installs once their upstreams release the required
          # fixes to PyPI; the floors in pyproject.toml will then suffice.
          # (2) the topology-driven sectionate API + the outer-lattice multi-tile corner
          #     topology / exact padded transports (MOM6-community/sectionate#48, which
          #     builds on #47). This is the branch that gives the most complete multi-tile
          #     boundary treatment, so regionate is pinned to it rather than #47.
          python -m pip install "sectionate @ git+https://github.com/MOM6-community/sectionate.git@refs/pull/48/head"
          python -m pip install -e .
          # (1) the xgcm bipolar north-fold boundary (xgcm#711, tripolar-north-fold), which
          #     also contains the face_connections halo-padding fix (xgcm#712) needed for
          #     correct multi-tile (lat-lon-cap / cap) padding, plus the bare-DataArray
          #     other_component vector-pad fix (xgcm#749) so vector diff/interp is correct
          #     across rotated/reversed seams. The combined branch tripolar-north-fold-vectorpad
          #     is tripolar-north-fold with xgcm#749 cherry-picked on top. Installed LAST with
          #     --force-reinstall --no-deps: setuptools_scm reports 0.1.devN on this branch
          #     (< the xgcm>=0.9.0 floors above), so installing it earlier gets clobbered by
          #     a PyPI xgcm reinstall pulled in to satisfy those floors.
          python -m pip install --force-reinstall --no-deps "xgcm @ git+https://github.com/hdrake/xgcm.git@tripolar-north-fold-vectorpad"
      - name: Conda list information
        run: |
          conda env list
          conda list
      - name: Test with pytest
        run: |
          pytest
