name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.7.0
        with:
          access_token: ${{ github.token }}
      - name: Checkout source
        uses: actions/checkout@v2

      - name: Conda setup
        uses: conda-incubator/setup-miniconda@v2
        with:
          channels: conda-forge
          mamba-version: '*'
          python-version: ${{ matrix.python-version }}
          activate-environment: test_env_regionate
          auto-activate-base: false

      - name: Set up conda environment
        run: |
          mamba env update -f ci/environment.yml
          python -m pip install -e .
      - name: Conda list information
        run: |
          conda env list
          conda list
      - name: Test with pytest
        run: |
          pytest

  docs:
    # pip-based docs build, mirroring .readthedocs.yaml (-W / fail_on_warning).
    # Pre-merge gate; uploads the rendered HTML as an artifact.
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Build docs
        run: |
          python -m sphinx -b html -W --keep-going docs docs/_build/html

      - name: Upload rendered docs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-html
          path: docs/_build/html
